# Time functions — one dedicated page each, reached from the Time hub ring.
#   page_time (hub) -> page_cities | page_pomodoro | page_stopwatch
#                      page_timer  | page_weather
# Cities: edit city_*_name / city_*_tz in packages/entities.yaml
# Weather: fetched in packages/weather.yaml (Open-Meteo); tap the hero to refresh
# Home clock face: lbl_clock_main / dow / dom / ind_clock_min (page_clock)

substitutions:
  city_zones: '"${city_1_tz}", "${city_2_tz}", "${city_3_tz}", "${city_4_tz}", "${city_5_tz}"'

globals:
  - id: city_index
    type: int
    initial_value: "0"
  - id: sw_running
    type: bool
    initial_value: "false"
  - id: sw_ms
    type: int
    initial_value: "0"
  - id: timer_running
    type: bool
    initial_value: "false"
  - id: timer_sec
    type: int
    initial_value: "300"
  - id: timer_remain
    type: int
    initial_value: "300"
  - id: pomo_running
    type: bool
    initial_value: "false"
  - id: pomo_focus
    type: bool
    initial_value: "true"
  - id: pomo_remain
    type: int
    initial_value: "1500"
  - id: pomo_focus_len
    type: int
    initial_value: "1500"
  - id: pomo_sessions
    type: int
    initial_value: "0"
  # Time hub ring focus: 0 cities 1 pomodoro 2 stopwatch 3 timer 4 weather
  - id: time_hub_index
    type: int
    initial_value: "0"

interval:
  - interval: 100ms
    then:
      - if:
          condition:
            lambda: "return id(sw_running);"
          then:
            - lambda: "id(sw_ms) += 100;"
            - if:
                condition:
                  lvgl.page.is_showing: page_stopwatch
                then:
                  - script.execute: sw_refresh
  - interval: 1s
    then:
      # Home clock — prefer SNTP, then HA, then RTC (ESPTime.day_of_week: Sunday=1)
      - if:
          condition:
            lvgl.page.is_showing: page_clock
          then:
            - lvgl.label.update:
                id: lbl_clock_main
                text: !lambda |-
                  auto t = id(sntp_time).now();
                  if (!t.is_valid()) return std::string("--:--");
                  char buf[16];
                  fmt_hhmm(buf, sizeof(buf), t.hour, t.minute, id(clock_24h));
                  return std::string(buf);
            - lvgl.label.update:
                id: lbl_clock_ampm
                text: !lambda |-
                  if (id(clock_24h)) return std::string("");
                  auto t = id(sntp_time).now();
                  if (!t.is_valid()) return std::string("");
                  return std::string(ampm_of(t.hour));
            - lvgl.label.update:
                id: lbl_clock_mon
                text: !lambda |-
                  auto t = id(sntp_time).now();
                  if (!t.is_valid()) return std::string("---");
                  return std::string(month_abbr(t.month));
            - lvgl.label.update:
                id: lbl_clock_dow
                text: !lambda |-
                  auto t = id(sntp_time).now();
                  static const char* days[] = {"SUN","MON","TUE","WED","THU","FRI","SAT"};
                  if (!t.is_valid() || t.day_of_week < 1 || t.day_of_week > 7)
                    return std::string("---");
                  return std::string(days[t.day_of_week - 1]);
            - lvgl.label.update:
                id: lbl_clock_dom
                text: !lambda |-
                  auto t = id(sntp_time).now();
                  char buf[8];
                  if (!t.is_valid()) return std::string("--");
                  snprintf(buf, sizeof(buf), "%02d", t.day_of_month);
                  return std::string(buf);
            - lvgl.indicator.update:
                id: ind_clock_min
                value: !lambda |-
                  auto t = id(sntp_time).now();
                  if (!t.is_valid()) return 0.0f;
                  return (float)t.minute + (t.second / 60.0f);
      - if:
          condition:
            lvgl.page.is_showing: page_time
          then:
            - script.execute: time_hub_refresh
      - if:
          condition:
            lvgl.page.is_showing: page_cities
          then:
            - script.execute: cities_refresh
      - if:
          condition:
            lambda: "return id(timer_running) && id(timer_remain) > 0;"
          then:
            - lambda: |-
                id(timer_remain) -= 1;
                if (id(timer_remain) <= 0) {
                  id(timer_running) = false;
                  id(timer_remain) = 0;
                }
            - if:
                condition:
                  lambda: "return id(timer_remain) <= 0;"
                then:
                  - script.execute:
                      id: ui_beep
                      tune: "alarm:d=8,o=6,b=140:c,e,g,c,g,e,c"
            - if:
                condition:
                  lvgl.page.is_showing: page_timer
                then:
                  - script.execute: timer_refresh
      - if:
          condition:
            lambda: "return id(pomo_running) && id(pomo_remain) > 0;"
          then:
            - lambda: |-
                id(pomo_remain) -= 1;
                if (id(pomo_remain) <= 0) {
                  if (id(pomo_focus)) {
                    id(pomo_sessions) += 1;
                    id(pomo_focus) = false;
                    id(pomo_remain) = 300;
                  } else {
                    id(pomo_focus) = true;
                    id(pomo_remain) = id(pomo_focus_len);
                  }
                }
            - if:
                condition:
                  lvgl.page.is_showing: page_pomodoro
                then:
                  - script.execute: pomo_refresh

script:
  # —— Time hub ————————————————————————————————————————————————
  - id: time_hub_refresh
    then:
      - lvgl.label.update:
          id: lbl_hub_clock
          text: !lambda |-
            auto t = id(sntp_time).now();
            if (!t.is_valid()) return std::string("--:--");
            char buf[16];
            fmt_hhmm(buf, sizeof(buf), t.hour, t.minute, id(clock_24h));
            return std::string(buf);

  # Ring order: 0 cities 1 pomodoro 2 stopwatch 3 timer 4 weather
  - id: time_hub_focus
    then:
      - lambda: |-
          int sel = id(time_hub_index);
          if (sel < 0) sel = 4;
          if (sel > 4) sel = 0;
          id(time_hub_index) = sel;
          lv_obj_t *btns[] = {id(btn_hub_cities), id(btn_hub_pomo), id(btn_hub_sw),
                              id(btn_hub_timer), id(btn_hub_wx)};
          lv_obj_t *icons[] = {id(icon_hub_cities), id(icon_hub_pomo), id(icon_hub_sw),
                               id(icon_hub_timer), id(icon_hub_wx)};
          const uint32_t tint[] = {0x63E7F2, 0xFF8A00, 0x9EA7AA, 0x9EA7AA, 0x63E7F2};
          for (int i = 0; i < 5; i++) {
            bool on = i == sel;
            lv_obj_set_style_border_color(btns[i], lv_color_hex(on ? 0xFFD400 : 0x333B3E), 0);
            lv_obj_set_style_text_color(icons[i], lv_color_hex(on ? 0xFFD400 : tint[i]), 0);
          }

  - id: time_hub_open
    then:
      - lambda: |-
          int i = id(time_hub_index);
          if (i < 0) i = 0;
          if (i > 4) i = 4;
          id(time_hub_index) = i;
      - script.execute:
          id: ui_beep
          tune: "mode:d=32,o=5,b=180:e"
      - if:
          condition:
            lambda: "return id(time_hub_index) == 0;"
          then:
            - script.execute: cities_refresh
            - lvgl.page.show: page_cities
      - if:
          condition:
            lambda: "return id(time_hub_index) == 1;"
          then:
            - script.execute: pomo_refresh
            - lvgl.page.show: page_pomodoro
      - if:
          condition:
            lambda: "return id(time_hub_index) == 2;"
          then:
            - script.execute: sw_refresh
            - lvgl.page.show: page_stopwatch
      - if:
          condition:
            lambda: "return id(time_hub_index) == 3;"
          then:
            - script.execute: timer_refresh
            - lvgl.page.show: page_timer
      - if:
          condition:
            lambda: "return id(time_hub_index) == 4;"
          then:
            - script.execute: weather_refresh
            - lvgl.page.show: page_weather
            - if:
                condition:
                  lambda: "return !id(wx_valid);"
                then:
                  - script.execute: weather_fetch

  # —— Cities ——————————————————————————————————————————————————
  - id: cities_refresh
    then:
      - lvgl.label.update:
          id: lbl_city_time
          text: !lambda |-
            static const char *const zones[] = {${city_zones}};
            struct tm c;
            if (!city_tz::local_now(zones[id(city_index) % 5], &c))
              return std::string("--:--");
            char buf[16];
            fmt_hhmm(buf, sizeof(buf), c.tm_hour, c.tm_min, id(clock_24h));
            if (!id(clock_24h)) {
              size_t n = strlen(buf);
              snprintf(buf + n, sizeof(buf) - n, " %s", ampm_of(c.tm_hour));
            }
            return std::string(buf);
      - lvgl.label.update:
          id: lbl_city_name
          text: !lambda |-
            static const char *const names[] = {
              "${city_1_name}", "${city_2_name}", "${city_3_name}",
              "${city_4_name}", "${city_5_name}"
            };
            static const char *const zones[] = {${city_zones}};
            static const char *const days[] = {"SUN","MON","TUE","WED","THU","FRI","SAT"};
            int i = id(city_index) % 5;
            std::string s = names[i];
            // Name the weekday when the city is already on another date.
            struct tm c;
            auto home = id(sntp_time).now();
            if (home.is_valid() && city_tz::local_now(zones[i], &c) && c.tm_mday != home.day_of_month)
              s = s + " (" + days[c.tm_wday] + ")";
            return s;
      - lvgl.label.update:
          id: lbl_city_dots
          text: !lambda |-
            std::string s;
            for (int i = 0; i < 5; i++)
              s += (i == id(city_index) % 5) ? "*" : ".";
            return s;

  - id: city_step
    parameters:
      delta: int
    then:
      - lambda: "id(city_index) = (id(city_index) + (delta > 0 ? 1 : 4)) % 5;"
      - script.execute: cities_refresh
      - script.execute:
          id: ui_beep
          tune: "click:d=32,o=5,b=200:c"

  # —— Pomodoro ————————————————————————————————————————————————
  - id: pomo_refresh
    then:
      - lvgl.label.update:
          id: lbl_pomo_time
          text: !lambda |-
            int t = id(pomo_remain);
            char buf[16];
            snprintf(buf, sizeof(buf), "%02d:%02d", t / 60, t % 60);
            return std::string(buf);
          text_color: !lambda |-
            return id(pomo_focus) ? lv_color_hex(0xFF8A00) : lv_color_hex(0x63E7F2);
      - lvgl.label.update:
          id: lbl_pomo_state
          text: !lambda |-
            char buf[32];
            snprintf(buf, sizeof(buf), "%s  -  %d done",
                     id(pomo_focus) ? "FOCUS" : "BREAK", id(pomo_sessions));
            return std::string(buf);
      - lvgl.label.update:
          id: icon_pomo_play
          text: !lambda |-
            return std::string(id(pomo_running) ? "\U000F03E4" : "\U000F040A");
      - lvgl.arc.update:
          id: arc_pomo
          value: !lambda |-
            int total = id(pomo_focus) ? id(pomo_focus_len) : 300;
            if (total <= 0) return 0.0f;
            return 100.0f * (float) id(pomo_remain) / (float) total;

  - id: pomo_toggle
    then:
      - lambda: "id(pomo_running) = !id(pomo_running);"
      - script.execute: pomo_refresh
      - script.execute:
          id: ui_beep
          tune: "ok:d=32,o=5,b=180:g,c6"

  - id: pomo_reset
    then:
      - lambda: |-
          id(pomo_running) = false;
          id(pomo_focus) = true;
          id(pomo_remain) = id(pomo_focus_len);
      - script.execute: pomo_refresh
      - script.execute:
          id: ui_beep
          tune: "rst:d=32,o=5,b=180:c6,g"

  # —— Stopwatch ———————————————————————————————————————————————
  - id: sw_refresh
    then:
      - lvgl.label.update:
          id: lbl_sw_time
          text: !lambda |-
            int t = id(sw_ms);
            char buf[16];
            snprintf(buf, sizeof(buf), "%02d:%02d.%01d",
                     (t / 60000) % 60, (t / 1000) % 60, (t / 100) % 10);
            return std::string(buf);
      - lvgl.label.update:
          id: lbl_sw_state
          text: !lambda |-
            return std::string(id(sw_running) ? "RUNNING" : "STOPPED");
          text_color: !lambda |-
            return id(sw_running) ? lv_color_hex(0x63E7F2) : lv_color_hex(0x9EA7AA);
      - lvgl.label.update:
          id: icon_sw_play
          text: !lambda |-
            return std::string(id(sw_running) ? "\U000F03E4" : "\U000F040A");

  - id: sw_toggle
    then:
      - lambda: "id(sw_running) = !id(sw_running);"
      - script.execute: sw_refresh
      - script.execute:
          id: ui_beep
          tune: "ok:d=32,o=5,b=180:g,c6"

  - id: sw_reset
    then:
      - lambda: |-
          id(sw_running) = false;
          id(sw_ms) = 0;
      - script.execute: sw_refresh
      - script.execute:
          id: ui_beep
          tune: "rst:d=32,o=5,b=180:c6,g"

  # —— Timer ———————————————————————————————————————————————————
  - id: timer_refresh
    then:
      - lvgl.label.update:
          id: lbl_timer_time
          text: !lambda |-
            // Hours only when there are any: "00:05:00" is wider than the
            // arc's inner circle, "05:00" is not.
            int t = id(timer_remain);
            char buf[16];
            if (t >= 3600)
              snprintf(buf, sizeof(buf), "%d:%02d:%02d", t / 3600, (t / 60) % 60, t % 60);
            else
              snprintf(buf, sizeof(buf), "%02d:%02d", (t / 60) % 60, t % 60);
            return std::string(buf);
          text_color: !lambda |-
            return id(timer_running) ? lv_color_hex(0x63E7F2) : lv_color_hex(0xF4F7F8);
      - lvgl.label.update:
          id: lbl_timer_state
          text: !lambda |-
            char buf[32];
            snprintf(buf, sizeof(buf), "%s  -  set %d min",
                     id(timer_running) ? "RUNNING" : "READY", id(timer_sec) / 60);
            return std::string(buf);
      - lvgl.label.update:
          id: icon_timer_play
          text: !lambda |-
            return std::string(id(timer_running) ? "\U000F03E4" : "\U000F040A");
      - lvgl.arc.update:
          id: arc_timer
          value: !lambda |-
            if (id(timer_sec) <= 0) return 0.0f;
            return 100.0f * (float) id(timer_remain) / (float) id(timer_sec);

  - id: timer_toggle
    then:
      - lambda: |-
          if (!id(timer_running) && id(timer_remain) == 0)
            id(timer_remain) = id(timer_sec);
          id(timer_running) = !id(timer_running);
      - script.execute: timer_refresh
      - script.execute:
          id: ui_beep
          tune: "ok:d=32,o=5,b=180:g,c6"

  - id: timer_reset
    then:
      - lambda: |-
          id(timer_running) = false;
          id(timer_remain) = id(timer_sec);
      - script.execute: timer_refresh
      - script.execute:
          id: ui_beep
          tune: "rst:d=32,o=5,b=180:c6,g"

  - id: timer_adjust
    parameters:
      delta: int
    then:
      - lambda: |-
          if (id(timer_running)) return;
          id(timer_sec) += (delta > 0) ? 60 : -60;
          if (id(timer_sec) < 60) id(timer_sec) = 60;
          if (id(timer_sec) > 7200) id(timer_sec) = 7200;
          id(timer_remain) = id(timer_sec);
      - script.execute: timer_refresh

  - id: pomo_adjust
    parameters:
      delta: int
    then:
      - lambda: |-
          if (id(pomo_running)) return;
          id(pomo_focus_len) += (delta > 0) ? 60 : -60;
          if (id(pomo_focus_len) < 60) id(pomo_focus_len) = 60;
          if (id(pomo_focus_len) > 3600) id(pomo_focus_len) = 3600;
          if (id(pomo_focus)) id(pomo_remain) = id(pomo_focus_len);
      - script.execute: pomo_refresh

  # —— Weather —————————————————————————————————————————————————
  - id: weather_refresh
    then:
      - lvgl.label.update:
          id: icon_wx_hero
          text: !lambda "return std::string(wmo_icon(id(wx_code)));"
      - lvgl.label.update:
          id: lbl_wx_temp
          text: !lambda |-
            if (isnan(id(wx_temp))) return std::string("--°");
            char buf[16];
            snprintf(buf, sizeof(buf), "%.0f°", id(wx_temp));
            return std::string(buf);
      - lvgl.label.update:
          id: lbl_wx_sky
          text: !lambda |-
            if (!id(wx_valid)) return std::string("FETCHING");
            return std::string(wmo_word(id(wx_code)));
      - lvgl.label.update:
          id: lbl_wx_sub
          text: !lambda |-
            if (!id(wx_valid)) return std::string("");
            char buf[40];
            snprintf(buf, sizeof(buf), "%.0f / %.0f°   %.0f%%",
                     id(wx_tmin), id(wx_tmax), id(wx_hum));
            return std::string(buf);
      - lambda: |-
          // Four 3-hourly slots. The strip runs out at the end of the day, so
          // a slot with no data is blanked rather than left showing yesterday.
          lv_obj_t *icons[] = {id(icon_wx_h0), id(icon_wx_h1), id(icon_wx_h2), id(icon_wx_h3)};
          lv_obj_t *hours[] = {id(lbl_wx_h0), id(lbl_wx_h1), id(lbl_wx_h2), id(lbl_wx_h3)};
          lv_obj_t *temps[] = {id(lbl_wxt_h0), id(lbl_wxt_h1), id(lbl_wxt_h2), id(lbl_wxt_h3)};
          char buf[12];
          for (int i = 0; i < 4; i++) {
            lv_label_set_text(icons[i], i < (int) id(wx_hr_code).size()
                                            ? wmo_icon(id(wx_hr_code)[i]) : "");
            if (i < (int) id(wx_hr_hour).size()) {
              snprintf(buf, sizeof(buf), "%02d", id(wx_hr_hour)[i]);
              lv_label_set_text(hours[i], buf);
            } else {
              lv_label_set_text(hours[i], "");
            }
            if (i < (int) id(wx_hr_temp).size() && !isnan(id(wx_hr_temp)[i])) {
              snprintf(buf, sizeof(buf), "%.0f°", id(wx_hr_temp)[i]);
              lv_label_set_text(temps[i], buf);
            } else {
              lv_label_set_text(temps[i], "");
            }
          }

  # Thin wrappers so on_click / encoder actions can be parameterless
  - id: city_next
    then:
      - script.execute: {id: city_step, delta: 1}
  - id: city_prev
    then:
      - script.execute: {id: city_step, delta: -1}
  - id: timer_up
    then:
      - script.execute: {id: timer_adjust, delta: 1}
  - id: timer_down
    then:
      - script.execute: {id: timer_adjust, delta: -1}
  - id: pomo_up
    then:
      - script.execute: {id: pomo_adjust, delta: 1}
  - id: pomo_down
    then:
      - script.execute: {id: pomo_adjust, delta: -1}
