substitutions:
  # Double-tap window on the clock face. Measured from PRESS (touch-down), not
  # release: on_click only fires on release and adds ~300ms of variable latency.
  # Real finger double-taps on this screen measured 600-1100ms apart.
  clock_double_tap_ms: "900"

# Volos industrial UI — 240x240 round, safe circle ~r≤100
# Tokens: bg 0x0B0F11, text 0xF4F7F8, secondary 0x9EA7AA, amber 0xFFD400,
#         warm 0xFF8A00, cyan 0x63E7F2, border 0x333B3E

# Roboto renders cleaner than Rubik at 12–15px on GC9A01; bpp 4 keeps AA light.
font:
  - file: "gfonts://Roboto"
    id: font_ui
    size: 15
    bpp: 4
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~°"
  - file: "gfonts://Roboto@500"
    id: font_clock
    size: 52
    bpp: 4
    glyphs: "0123456789:"
  - file: "gfonts://Roboto@500"
    id: font_big
    size: 34
    bpp: 4
    glyphs: "0123456789:.-°% ABCDEFGHIJKLMNOPQRSTUVWXYZ"
  - file: "gfonts://Roboto"
    id: font_label
    size: 12
    bpp: 4
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~°"
  # Material Design Icons. Codepoints verified against upstream meta.json —
  # do not guess these, several differ from the obvious value
  # (clock-outline is F0150, brightness-6 is F00DF).
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: font_icon
    size: 18
    bpp: 4
    glyphs:
      - "\U000F0493"  # cog            settings
      - "\U000F0717"  # snowflake      AC
      - "\U000F06A5"  # power-plug     plugs
      - "\U000F0335"  # lightbulb      lights
      - "\U000F0150"  # clock-outline  time
      - "\U000F03D8"  # palette        scenes
      - "\U000F02DC"  # home           launcher centre
      - "\U000F0142"  # chevron-right  list affordance
      - "\U000F004D"  # arrow-left     back
      - "\U000F00DF"  # brightness-6   display
      - "\U000F0467"  # rotate-right   rotate
      - "\U000F05A9"  # wifi           network
      - "\U000F057E"  # volume-high    audio
      - "\U000F0594"  # weather-night  night
      - "\U000F0003"  # access-point   AP fallback
      - "\U000F0210"  # fan
      - "\U000F0425"  # power
      - "\U000F050F"  # thermometer
      - "\U000F01E7"  # earth          cities
      - "\U000F051F"  # timer-sand     pomodoro
      - "\U000F051B"  # timer-outline  stopwatch
      - "\U000F13AB"  # timer          timer
      - "\U000F040A"  # play
      - "\U000F03E4"  # pause
      - "\U000F0709"  # restart
      - "\U000F0141"  # chevron-left
      - "\U000F0374"  # minus
      - "\U000F0415"  # plus
      - "\U000F0599"  # weather-sunny
      - "\U000F0595"  # weather-partly-cloudy
      - "\U000F0590"  # weather-cloudy
      - "\U000F0591"  # weather-fog
      - "\U000F0597"  # weather-rainy
      - "\U000F0596"  # weather-pouring
      - "\U000F0598"  # weather-snowy
      - "\U000F0593"  # weather-lightning
      - "\U000F067F"  # weather-snowy-rainy
  # Larger weather glyph for the Weather page hero
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: font_icon_big
    size: 40
    bpp: 4
    glyphs:
      - "\U000F0599"  # weather-sunny
      - "\U000F0595"  # weather-partly-cloudy
      - "\U000F0590"  # weather-cloudy
      - "\U000F0591"  # weather-fog
      - "\U000F0597"  # weather-rainy
      - "\U000F0596"  # weather-pouring
      - "\U000F0598"  # weather-snowy
      - "\U000F0593"  # weather-lightning
      - "\U000F067F"  # weather-snowy-rainy

globals:
  - id: light_index
    type: int
    initial_value: "0"
  # Brightness target for the selected light, 5..255. Seeded from HA on select.
  - id: light_bri
    type: int
    initial_value: "128"
  - id: plug_sel
    type: int
    initial_value: "0"
  - id: scene_index
    type: int
    initial_value: "0"
  - id: launcher_index
    type: int
    initial_value: "1"
  - id: settings_index
    type: int
    initial_value: "0"
  - id: night_mode_enabled
    type: bool
    initial_value: "false"
  - id: fallback_ap_enabled
    type: bool
    initial_value: "false"
  - id: ui_sound_enabled
    type: bool
    initial_value: "false"
  - id: screen_forced_off
    type: bool
    initial_value: "false"
  - id: display_asleep
    type: bool
    initial_value: "false"
  - id: display_rotation
    type: int
    initial_value: "180"
  # Double-tap detection for the clock face. LVGL's own DOUBLE_CLICKED needs
  # both taps within scroll_limit (10px) and long_press_time (400ms), which is
  # unrealistic for a finger; this uses time only, with a wider window.
  - id: clock_tap_ms
    type: uint32_t
    initial_value: "0"
  - id: clock_tap_dbl
    type: bool
    initial_value: "false"
  # Clock face options (persisted via settings_store.h)
  - id: clock_24h
    type: bool
    initial_value: "true"
  - id: ring_numerals
    type: bool
    initial_value: "true"
  # Page that was showing when the front button was pressed — see front_action.
  - id: front_page
    type: lv_obj_t *
    initial_value: "nullptr"
  # AC dial target: 0=temp 1=fan 2=swing
  - id: ac_focus
    type: int
    initial_value: "0"

# Home Assistant pushes light state whenever it changes, but nothing on the
# Dial listens; polling the page that is actually on screen is the same trick
# packages/time.yaml uses for the clock and cities.
interval:
  - interval: 1s
    then:
      - if:
          condition:
            lvgl.page.is_showing: page_lights
          then:
            - script.execute: lights_refresh

script:
  - id: ui_beep
    parameters:
      tune: string
    then:
      - lambda: |-
          if (!id(ui_sound_enabled)) return;
          id(buzzer).play(tune.c_str());

  - id: screen_sleep
    then:
      - lambda: "id(display_asleep) = true;"
      - light.turn_on:
          id: display_backlight
          brightness: 0%
      - lvgl.page.show: page_clock

  - id: go_home_clock
    then:
      - lambda: "id(display_asleep) = false;"
      - light.turn_on:
          id: display_backlight
          brightness: 20%
      - lvgl.page.show: page_clock

  # 0 Settings 1 AC 2 Plugs 3 Lights 4 Time 5 Scenes — order matches the
  # wedges clockwise from the top.
  - id: apply_launcher_focus
    then:
      - lambda: |-
          int sel = id(launcher_index);
          if (sel < 0) sel = 0;
          if (sel > 5) sel = 5;
          id(launcher_index) = sel;
          lv_obj_t *segs[] = {id(btn_seg_settings), id(btn_seg_ac), id(btn_seg_plugs),
                              id(btn_seg_lights), id(btn_seg_time), id(btn_seg_scenes)};
          lv_obj_t *labels[] = {id(lbl_seg_settings), id(lbl_seg_ac), id(lbl_seg_plugs),
                                id(lbl_seg_lights), id(lbl_seg_time), id(lbl_seg_scenes)};
          lv_obj_t *icons[] = {id(icon_seg_settings), id(icon_seg_ac), id(icon_seg_plugs),
                               id(icon_seg_lights), id(icon_seg_time), id(icon_seg_scenes)};
          // Resting icon tint per wedge; focus overrides all of them with amber.
          const uint32_t tint[] = {0x9EA7AA, 0x63E7F2, 0x9EA7AA, 0xFFD400, 0x9EA7AA, 0xFF8A00};
          for (int i = 0; i < 6; i++) {
            bool on = i == sel;
            lv_obj_set_style_border_color(segs[i], lv_color_hex(on ? 0xFFD400 : 0x333B3E), 0);
            lv_obj_set_style_text_color(labels[i], lv_color_hex(on ? 0xFFD400 : 0xF4F7F8), 0);
            lv_obj_set_style_text_color(icons[i], lv_color_hex(on ? 0xFFD400 : tint[i]), 0);
          }

  - id: launcher_open_selected
    then:
      - if:
          condition:
            lambda: "return id(launcher_index) == 0;"
          then:
            - script.execute: open_settings
      - if:
          condition:
            lambda: "return id(launcher_index) == 1;"
          then:
            - script.execute: open_ac
      - if:
          condition:
            lambda: "return id(launcher_index) == 2;"
          then:
            - script.execute: open_plugs
      - if:
          condition:
            lambda: "return id(launcher_index) == 3;"
          then:
            - script.execute: open_lights
      - if:
          condition:
            lambda: "return id(launcher_index) == 4;"
          then:
            - script.execute: open_time
      - if:
          condition:
            lambda: "return id(launcher_index) == 5;"
          then:
            - script.execute: open_scenes

  # Touch on the clock face wakes the backlight but stays put; a double tap is
  # what opens the launcher. Idle (45s) drops back to the dim level.
  - id: clock_tap
    then:
      - lambda: |-
          uint32_t now = millis();
          uint32_t dt = now - id(clock_tap_ms);
          id(clock_tap_dbl) = (id(clock_tap_ms) != 0) && (dt < ${clock_double_tap_ms});
          id(clock_tap_ms) = id(clock_tap_dbl) ? 0 : now;
          // Bump the logger to DEBUG to retune ${clock_double_tap_ms}
          ESP_LOGD("ui", "clock tap dt=%ums double=%d", (unsigned) dt,
                   (int) id(clock_tap_dbl));
      - if:
          condition:
            lambda: "return id(clock_tap_dbl);"
          then:
            - script.execute: wake_to_launcher
          else:
            - script.execute: clock_wake_bright

  - id: clock_wake_bright
    then:
      - lambda: |-
          id(display_asleep) = false;
          id(screen_forced_off) = false;
      - light.turn_on:
          id: display_backlight
          brightness: 100%

  - id: wake_to_launcher
    then:
      - lambda: |-
          id(display_asleep) = false;
          id(screen_forced_off) = false;
      - light.turn_on:
          id: display_backlight
          brightness: 100%
      - lvgl.page.show: page_launcher
      - script.execute: apply_launcher_focus

  - id: nav_back
    then:
      - if:
          condition:
            lvgl.page.is_showing: page_launcher
          then:
            - script.execute: go_home_clock
          else:
            - if:
                condition:
                  lvgl.page.is_showing: page_clock
                then:
                  - script.execute: wake_to_launcher
                else:
                  - light.turn_on:
                      id: display_backlight
                      brightness: 100%
                  # Time sub-pages step back to the Time hub, not the launcher
                  - if:
                      condition:
                        or:
                          - lvgl.page.is_showing: page_cities
                          - lvgl.page.is_showing: page_pomodoro
                          - lvgl.page.is_showing: page_stopwatch
                          - lvgl.page.is_showing: page_timer
                          - lvgl.page.is_showing: page_weather
                      then:
                        - lvgl.page.show: page_time
                        - script.execute: time_hub_refresh
                        - script.execute: time_hub_focus
                      else:
                        - lvgl.page.show: page_launcher
                        - script.execute: apply_launcher_focus
      - script.execute:
          id: ui_beep
          tune: "back:d=16,o=5,b=160:e,c"

  - id: maybe_wake
    then:
      - if:
          condition:
            or:
              - lambda: "return id(display_asleep);"
              - lvgl.page.is_showing: page_clock
          then:
            - script.execute: clock_wake_bright

  - id: front_action
    then:
      # Snapshot the page *before* any handler runs. Several of them navigate
      # (the launcher opens a page, the Time hub opens a sub-page), and with a
      # flat chain of `lvgl.page.is_showing` the new page's handler would fire
      # in the same press — one click on the launcher landed on Cities.
      - lambda: "id(front_page) = lv_screen_active();"
      - if:
          condition:
            lambda: "return id(front_page) == id(page_launcher)->obj;"
          then:
            - script.execute: launcher_open_selected
      - if:
          condition:
            lambda: "return id(front_page) == id(page_settings)->obj;"
          then:
            - script.execute: settings_activate
      - if:
          condition:
            lambda: "return id(front_page) == id(page_scenes)->obj;"
          then:
            - script.execute: scene_activate
      - if:
          condition:
            lambda: "return id(front_page) == id(page_plugs)->obj;"
          then:
            - script.execute: plug_toggle
      - if:
          condition:
            lambda: "return id(front_page) == id(page_lights)->obj;"
          then:
            - script.execute: light_toggle
      - if:
          condition:
            lambda: "return id(front_page) == id(page_ac)->obj;"
          then:
            # Dial adjusts the focused field; the press picks which one.
            - script.execute:
                id: ac_set_focus
                focus: !lambda "return id(ac_focus) == 0 ? 1 : 0;"
      - if:
          condition:
            lambda: "return id(front_page) == id(page_time)->obj;"
          then:
            - script.execute: time_hub_open
      - if:
          condition:
            lambda: "return id(front_page) == id(page_pomodoro)->obj;"
          then:
            - script.execute: pomo_toggle
      - if:
          condition:
            lambda: "return id(front_page) == id(page_stopwatch)->obj;"
          then:
            - script.execute: sw_toggle
      - if:
          condition:
            lambda: "return id(front_page) == id(page_timer)->obj;"
          then:
            - script.execute: timer_toggle
      - if:
          condition:
            lambda: "return id(front_page) == id(page_weather)->obj;"
          then:
            - script.execute: weather_fetch

  - id: front_or_wake
    then:
      - if:
          condition:
            or:
              - lambda: "return id(display_asleep);"
              - lvgl.page.is_showing: page_clock
          then:
            - script.execute: wake_to_launcher
          else:
            - script.execute: front_action

  - id: encoder_nav_cw
    then:
      - if:
          condition:
            lvgl.page.is_showing: page_launcher
          then:
            - lambda: "id(launcher_index) = (id(launcher_index) + 1) % 6;"
            - script.execute: apply_launcher_focus
      - if:
          condition:
            lvgl.page.is_showing: page_settings
          then:
            - lambda: "id(settings_index) = (id(settings_index) + 1) % 8;"
            - script.execute: apply_settings_focus
      - if:
          condition:
            lvgl.page.is_showing: page_lights
          then:
            - script.execute:
                id: light_bri_step
                delta: 1
      - if:
          condition:
            lvgl.page.is_showing: page_plugs
          then:
            - lambda: "id(plug_sel) = (id(plug_sel) + 1) % ${plug_count};"
            - script.execute: plugs_refresh
      - if:
          condition:
            lvgl.page.is_showing: page_scenes
          then:
            - lambda: "id(scene_index) = (id(scene_index) + 1) % 4;"
            - script.execute: scenes_refresh
      - if:
          condition:
            lvgl.page.is_showing: page_time
          then:
            - lambda: "id(time_hub_index) = (id(time_hub_index) + 1) % 5;"
            - script.execute: time_hub_focus
      - if:
          condition:
            lvgl.page.is_showing: page_cities
          then:
            - script.execute: city_next
      - if:
          condition:
            lvgl.page.is_showing: page_timer
          then:
            - script.execute: timer_up
      - if:
          condition:
            lvgl.page.is_showing: page_pomodoro
          then:
            - script.execute: pomo_up
      - if:
          condition:
            lvgl.page.is_showing: page_ac
          then:
            - script.execute:
                id: ac_dial_adjust
                delta: 1

  - id: encoder_nav_ccw
    then:
      - if:
          condition:
            lvgl.page.is_showing: page_launcher
          then:
            - lambda: "id(launcher_index) = (id(launcher_index) + 5) % 6;"
            - script.execute: apply_launcher_focus
      - if:
          condition:
            lvgl.page.is_showing: page_settings
          then:
            - lambda: "id(settings_index) = (id(settings_index) + 7) % 8;"
            - script.execute: apply_settings_focus
      - if:
          condition:
            lvgl.page.is_showing: page_lights
          then:
            - script.execute:
                id: light_bri_step
                delta: -1
      - if:
          condition:
            lvgl.page.is_showing: page_plugs
          then:
            - lambda: "id(plug_sel) = (id(plug_sel) + ${plug_count} - 1) % ${plug_count};"
            - script.execute: plugs_refresh
      - if:
          condition:
            lvgl.page.is_showing: page_scenes
          then:
            - lambda: "id(scene_index) = (id(scene_index) + 3) % 4;"
            - script.execute: scenes_refresh
      - if:
          condition:
            lvgl.page.is_showing: page_time
          then:
            - lambda: "id(time_hub_index) = (id(time_hub_index) + 4) % 5;"
            - script.execute: time_hub_focus
      - if:
          condition:
            lvgl.page.is_showing: page_cities
          then:
            - script.execute: city_prev
      - if:
          condition:
            lvgl.page.is_showing: page_timer
          then:
            - script.execute: timer_down
      - if:
          condition:
            lvgl.page.is_showing: page_pomodoro
          then:
            - script.execute: pomo_down
      - if:
          condition:
            lvgl.page.is_showing: page_ac
          then:
            - script.execute:
                id: ac_dial_adjust
                delta: -1

  - id: open_ac
    then:
      - light.turn_on:
          id: display_backlight
          brightness: 100%
      - lambda: "id(ac_focus) = 0;"
      - lvgl.page.show: page_ac
      - script.execute: ac_refresh
  - id: open_lights
    then:
      - light.turn_on:
          id: display_backlight
          brightness: 100%
      - lvgl.page.show: page_lights
      - script.execute:
          id: light_select
          i: !lambda "return id(light_index);"
  - id: open_plugs
    then:
      - light.turn_on:
          id: display_backlight
          brightness: 100%
      - lvgl.page.show: page_plugs
      - script.execute: plugs_refresh
  - id: open_time
    then:
      - light.turn_on:
          id: display_backlight
          brightness: 100%
      - lvgl.page.show: page_time
      - script.execute: time_hub_refresh
      - script.execute: time_hub_focus
  - id: open_scenes
    then:
      - light.turn_on:
          id: display_backlight
          brightness: 100%
      - lvgl.page.show: page_scenes
      - script.execute: scenes_refresh
  - id: apply_fallback_ap
    then:
      - lambda: |-
          id(wifi_sta).set_ap_timeout(id(fallback_ap_enabled) ? 90000 : 0);

  - id: open_settings
    then:
      - light.turn_on:
          id: display_backlight
          brightness: 100%
      - lvgl.page.show: page_settings
      - script.execute: settings_refresh

  - id: apply_ring_numerals
    then:
      - lambda: |-
          // The scale draws a label per major tick (0,5..60 -> 13 of them).
          // Supply zero-padded text and blank the 13th, which sits on top of
          // the first at 12 o'clock.
          // Not `const char *const[]` — lv_scale_set_text_src takes char**
          static const char *TICKS[] = {
            "00", "05", "10", "15", "20", "25", "30",
            "35", "40", "45", "50", "55", "", nullptr};
          lv_scale_set_text_src(id(clock_scale), TICKS);
          lv_scale_set_label_show(id(clock_scale), id(ring_numerals));
          // ESPHome styles the tick lines but not the label text: without this
          // the numerals render in the theme default colour and vanish on black.
          lv_obj_set_style_text_color(id(clock_scale), lv_color_hex(0x9EA7AA),
                                      LV_PART_INDICATOR);
          lv_obj_set_style_text_font(id(clock_scale), id(font_label),
                                     LV_PART_INDICATOR);
          lv_obj_invalidate(id(clock_meter));

  - id: apply_display_rotation
    then:
      - lvgl.display.set_rotation:
          rotation: !lambda |-
            // LVGL takes any multiple of 90 and rotates touch input to match.
            // Snap and wrap so a bad stored value can never wedge the display.
            int r = id(display_rotation);
            r = (r / 90) * 90 % 360;
            if (r < 0) r += 360;
            id(display_rotation) = r;
            return r;

  - id: settings_refresh
    then:
      - lvgl.label.update:
          id: lbl_set_rotate_val
          text: !lambda |-
            char buf[8];
            snprintf(buf, sizeof(buf), "%d°", id(display_rotation));
            return std::string(buf);
      - lvgl.label.update:
          id: lbl_set_clock_val
          text: !lambda |-
            return std::string(id(clock_24h) ? "24H" : "12H");
      - lvgl.label.update:
          id: lbl_set_ticks_val
          text: !lambda |-
            return std::string(id(ring_numerals) ? "ON" : "OFF");
      - lvgl.label.update:
          id: lbl_set_disp_val
          text: "OFF"
      - lvgl.label.update:
          id: lbl_set_net_val
          text: !lambda |-
            if (id(wifi_sta).is_connected()) {
              auto ip = id(wifi_ip).state;
              if (!ip.empty()) return ip;
              return std::string("ON");
            }
            return std::string("OFF");
      - lvgl.label.update:
          id: lbl_set_audio_val
          text: !lambda |-
            return std::string(id(ui_sound_enabled) ? "ON" : "OFF");
      - lvgl.label.update:
          id: lbl_set_night_val
          text: !lambda |-
            return std::string(id(night_mode_enabled) ? "ON" : "OFF");
      - lvgl.label.update:
          id: lbl_set_ap_val
          text: !lambda |-
            return std::string(id(fallback_ap_enabled) ? "ON" : "OFF");
      - script.execute: apply_settings_focus

  - id: apply_settings_focus
    then:
      - lambda: |-
          lv_obj_t *rows[] = {id(row_set_display), id(row_set_rotate), id(row_set_clock),
                              id(row_set_ticks), id(row_set_network), id(row_set_audio),
                              id(row_set_night), id(row_set_ap)};
          int sel = id(settings_index);
          for (int i = 0; i < 8; i++)
            lv_obj_set_style_border_color(rows[i], lv_color_hex(i == sel ? 0xFFD400 : 0x333B3E), 0);
          // Keep the focused row visible in the scrolling container
          if (sel >= 0 && sel < 8)
            lv_obj_scroll_to_view(rows[sel], LV_ANIM_ON);

  - id: settings_activate
    then:
      # 0 Display  1 Rotate  2 Clock  3 Dial nums  4 Network  5 Audio  6 Night  7 AP
      - if:
          condition:
            lambda: "return id(settings_index) == 0;"
          then:
            - lambda: "id(screen_forced_off) = true;"
            - script.execute: screen_sleep
      - if:
          condition:
            lambda: "return id(settings_index) == 1;"
          then:
            - lambda: |-
                id(display_rotation) = (id(display_rotation) + 90) % 360;
                m5dial::store_now<m5dial::KEY_ROTATION>(id(display_rotation));
            - script.execute: apply_display_rotation
      - if:
          condition:
            lambda: "return id(settings_index) == 2;"
          then:
            - lambda: |-
                id(clock_24h) = !id(clock_24h);
                m5dial::store_now<m5dial::KEY_CLOCK24>(id(clock_24h));
      - if:
          condition:
            lambda: "return id(settings_index) == 3;"
          then:
            - lambda: |-
                id(ring_numerals) = !id(ring_numerals);
                m5dial::store_now<m5dial::KEY_TICKNUM>(id(ring_numerals));
            - script.execute: apply_ring_numerals
      - if:
          condition:
            lambda: "return id(settings_index) == 5;"
          then:
            - lambda: |-
                id(ui_sound_enabled) = !id(ui_sound_enabled);
                m5dial::store_now<m5dial::KEY_SOUND>(id(ui_sound_enabled));
      - if:
          condition:
            lambda: "return id(settings_index) == 6;"
          then:
            - lambda: |-
                id(night_mode_enabled) = !id(night_mode_enabled);
                m5dial::store_now<m5dial::KEY_NIGHT>(id(night_mode_enabled));
      - if:
          condition:
            lambda: "return id(settings_index) == 7;"
          then:
            - lambda: |-
                id(fallback_ap_enabled) = !id(fallback_ap_enabled);
                m5dial::store_now<m5dial::KEY_AP>(id(fallback_ap_enabled));
            - script.execute: apply_fallback_ap
      # Row 4 (Network) is read-only
      - script.execute: settings_refresh
      - script.execute:
          id: ui_beep
          tune: "ok:d=32,o=5,b=180:e"

  # Lights page. The first tap on a card only selects it; tapping the selected
  # card toggles it. So the dial can be aimed at a light without switching it,
  # and a mis-aimed tap costs nothing. The dial then changes that light's
  # brightness — tracked locally in light_bri, because Home Assistant's
  # reported value lags a command by a refresh and the dial would feel like it
  # was fighting back.
  - id: light_card_tap
    parameters:
      i: int
    then:
      - if:
          condition:
            lambda: "return id(light_index) == i;"
          then:
            - script.execute: light_toggle
          else:
            - script.execute:
                id: light_select
                i: !lambda "return i;"

  - id: light_select
    parameters:
      i: int
    then:
      - lambda: |-
          id(light_index) = (i < 0 || i > 3) ? 0 : i;
          const float bri[] = {id(ha_light_1_bri).state, id(ha_light_2_bri).state,
                               id(ha_light_3_bri).state, id(ha_light_4_bri).state};
          float b = bri[id(light_index)];
          id(light_bri) = isnan(b) ? 128 : (int) b;
      - script.execute: lights_refresh

  - id: light_bri_step
    parameters:
      delta: int
    then:
      - lambda: |-
          int v = id(light_bri) + (delta > 0 ? 16 : -16);
          // Floor at 5/255 rather than 0: brightness 0 is "off" to HA, and the
          // dial should dim a light, not switch it off behind your back.
          id(light_bri) = v < 5 ? 5 : (v > 255 ? 255 : v);
          lv_slider_set_value(id(sld_light_bri), id(light_bri), LV_ANIM_OFF);
      - script.execute: light_bri_commit

  # Debounced like ac_commit: the dial can spin freely, one call goes to HA
  # when it settles.
  - id: light_bri_commit
    mode: restart
    then:
      - delay: 250ms
      - script.execute:
          id: light_apply_bri
          bri: !lambda "return (float) id(light_bri);"

  - id: light_apply_bri
    parameters:
      bri: float
    then:
      - homeassistant.action:
          action: light.turn_on
          data:
            entity_id: !lambda |-
              static const char* ents[] = {
                "${light_1_entity}", "${light_2_entity}",
                "${light_3_entity}", "${light_4_entity}"
              };
              int i = id(light_index) % 4;
              return std::string(ents[i]);
            brightness: !lambda "return (int)bri;"

  - id: light_toggle
    then:
      - homeassistant.action:
          action: light.toggle
          data:
            entity_id: !lambda |-
              static const char* ents[] = {
                "${light_1_entity}", "${light_2_entity}",
                "${light_3_entity}", "${light_4_entity}"
              };
              return std::string(ents[id(light_index) % 4]);

  - id: lights_refresh
    then:
      - lambda: |-
          lv_obj_t *cards[] = {id(card_light_0), id(card_light_1),
                               id(card_light_2), id(card_light_3)};
          lv_obj_t *names[] = {id(lbl_light_0_name), id(lbl_light_1_name),
                               id(lbl_light_2_name), id(lbl_light_3_name)};
          lv_obj_t *vals[] = {id(lbl_light_0_bri), id(lbl_light_1_bri),
                              id(lbl_light_2_bri), id(lbl_light_3_bri)};
          const float bri[] = {id(ha_light_1_bri).state, id(ha_light_2_bri).state,
                               id(ha_light_3_bri).state, id(ha_light_4_bri).state};
          text_sensor::TextSensor *st[] = {id(ha_light_1_state), id(ha_light_2_state),
                                           id(ha_light_3_state), id(ha_light_4_state)};
          for (int i = 0; i < 4; i++) {
            bool on = st[i]->state == "on";
            lv_obj_set_style_border_color(
                cards[i], lv_color_hex(i == id(light_index) ? 0xFFD400 : 0x333B3E), 0);
            lv_obj_set_style_text_color(
                names[i], lv_color_hex(on ? 0xF4F7F8 : 0x5A6467), 0);
            char buf[12];
            if (!on)
              snprintf(buf, sizeof(buf), "OFF");
            else if (isnan(bri[i]))
              snprintf(buf, sizeof(buf), "ON");
            else
              snprintf(buf, sizeof(buf), "%.0f%%", bri[i] * 100.0f / 255.0f);
            lv_label_set_text(vals[i], buf);
            lv_obj_set_style_text_color(
                vals[i], lv_color_hex(on ? 0xFFD400 : 0x5A6467), 0);
          }
          // Not while a finger is on it, or the 1 Hz refresh below snaps the
          // knob back out from under the drag.
          if (!lv_obj_has_state(id(sld_light_bri), LV_STATE_PRESSED))
            lv_slider_set_value(id(sld_light_bri), id(light_bri), LV_ANIM_OFF);

  - id: plug_page_next
    then:
      - lambda: |-
          int n = ${plug_count};
          int pages = (n + 3) / 4;
          if (pages < 1) pages = 1;
          int page = id(plug_sel) / 4;
          page = (page + 1) % pages;
          id(plug_sel) = page * 4;
          if (id(plug_sel) >= n) id(plug_sel) = n - 1;
      - script.execute: plugs_refresh

  - id: plug_page_prev
    then:
      - lambda: |-
          int n = ${plug_count};
          int pages = (n + 3) / 4;
          if (pages < 1) pages = 1;
          int page = id(plug_sel) / 4;
          page = (page + pages - 1) % pages;
          id(plug_sel) = page * 4;
      - script.execute: plugs_refresh

  - id: plug_toggle
    then:
      - if:
          condition:
            lambda: |-
              static const char* ents[] = {
                "${plug_1_entity}", "${plug_2_entity}", "${plug_3_entity}", "${plug_4_entity}",
                "${plug_5_entity}", "${plug_6_entity}", "${plug_7_entity}", "${plug_8_entity}"
              };
              int i = id(plug_sel);
              if (i < 0 || i >= ${plug_count} || i > 7) return false;
              return strcmp(ents[i], "switch.none") != 0;
          then:
            - homeassistant.action:
                action: switch.toggle
                data:
                  entity_id: !lambda |-
                    static const char* ents[] = {
                      "${plug_1_entity}", "${plug_2_entity}", "${plug_3_entity}", "${plug_4_entity}",
                      "${plug_5_entity}", "${plug_6_entity}", "${plug_7_entity}", "${plug_8_entity}"
                    };
                    return std::string(ents[id(plug_sel)]);
            - script.execute:
                id: ui_beep
                tune: "plug:d=32,o=5,b=180:c,e"
            - delay: 200ms
            - script.execute: plugs_refresh

  - id: plugs_refresh
    then:
      - lambda: |-
          static const char *names[] = {
              "${plug_1_name}", "${plug_2_name}", "${plug_3_name}", "${plug_4_name}",
              "${plug_5_name}", "${plug_6_name}", "${plug_7_name}", "${plug_8_name}"};
          text_sensor::TextSensor *states[] = {
              id(ha_plug_1_state), id(ha_plug_2_state), id(ha_plug_3_state),
              id(ha_plug_4_state), id(ha_plug_5_state), id(ha_plug_6_state),
              id(ha_plug_7_state), id(ha_plug_8_state)};
          sensor::Sensor *power[] = {
              id(ha_plug_1_power), id(ha_plug_2_power), id(ha_plug_3_power),
              id(ha_plug_4_power), id(ha_plug_5_power), id(ha_plug_6_power),
              id(ha_plug_7_power), id(ha_plug_8_power)};
          lv_obj_t *rows[] = {id(row_plug_0), id(row_plug_1),
                              id(row_plug_2), id(row_plug_3)};
          lv_obj_t *lname[] = {id(lbl_plug_0_name), id(lbl_plug_1_name),
                               id(lbl_plug_2_name), id(lbl_plug_3_name)};
          lv_obj_t *lstate[] = {id(lbl_plug_0_st), id(lbl_plug_1_st),
                                id(lbl_plug_2_st), id(lbl_plug_3_st)};
          lv_obj_t *lwatt[] = {id(lbl_plug_0_w), id(lbl_plug_1_w),
                               id(lbl_plug_2_w), id(lbl_plug_3_w)};
          const int n = ${plug_count};
          int pages = (n + 3) / 4;
          if (pages < 1) pages = 1;
          const int page = id(plug_sel) / 4;
          char buf[16];
          snprintf(buf, sizeof(buf), "%d/%d", page + 1, pages);
          lv_label_set_text(id(lbl_plugs_page), buf);
          for (int i = 0; i < 4; i++) {
            lv_obj_set_style_border_color(
                rows[i], lv_color_hex((id(plug_sel) % 4) == i ? 0xFFD400 : 0x333B3E), 0);
            // The last page can be short; blank the leftover rows rather than
            // showing a stale entry from the page before.
            const int slot = page * 4 + i;
            if (slot >= n) {
              lv_label_set_text(lname[i], "");
              lv_label_set_text(lstate[i], "");
              lv_label_set_text(lwatt[i], "");
              continue;
            }
            lv_label_set_text(lname[i], names[slot]);
            const std::string s = states[slot]->state;
            lv_label_set_text(lstate[i], (s == "on" || s == "ON") ? "ON" : "OFF");
            const float w = power[slot]->state;
            if (isnan(w)) {
              lv_label_set_text(lwatt[i], "--W");
            } else {
              snprintf(buf, sizeof(buf), "%.0fW", w);
              lv_label_set_text(lwatt[i], buf);
            }
          }

  - id: scene_activate
    then:
      - homeassistant.action:
          action: scene.turn_on
          data:
            entity_id: !lambda |-
              static const char* ents[] = {
                "${scene_1_entity}", "${scene_2_entity}",
                "${scene_3_entity}", "${scene_4_entity}"
              };
              return std::string(ents[id(scene_index) % 4]);
      - script.execute:
          id: ui_beep
          tune: "ok:d=32,o=5,b=180:g,c6"

  - id: scenes_refresh
    then:
      - lambda: |-
          lv_obj_t *rows[] = {id(row_scene_0), id(row_scene_1), id(row_scene_2), id(row_scene_3)};
          for (int i = 0; i < 4; i++)
            lv_obj_set_style_border_color(
                rows[i], lv_color_hex(i == id(scene_index) ? 0xFFD400 : 0x333B3E), 0);

  # Arçelik AC — every frame is synthesised in packages/ac.yaml; nothing is
  # taught, so the page works straight after a reboot.
  # ac_focus: 0 = temperature, 1 = fan
  - id: ac_set_focus
    parameters:
      focus: int
    then:
      - lambda: |-
          int f = focus;
          if (f < 0) f = 0;
          if (f > 1) f = 1;
          id(ac_focus) = f;
      - script.execute: ac_refresh

  - id: ac_dial_adjust
    parameters:
      delta: int
    then:
      - lambda: |-
          int d = (delta > 0) ? 1 : -1;
          if (id(ac_focus) == 1) {
            int f = id(ac_fan) + d;
            if (f < 0) f = 5;
            if (f > 5) f = 0;
            id(ac_fan) = f;
          } else {
            int t = id(ac_temp) + d;
            if (t < 18) t = 18;
            if (t > 30) t = 30;
            id(ac_temp) = t;
          }
      - script.execute: ac_refresh
      # Dial can spin freely; one frame goes out 400ms after it settles
      - script.execute: ac_commit

  - id: ac_refresh
    then:
      - lvgl.arc.update:
          id: arc_ac
          value: !lambda "return id(ac_temp);"
      - lvgl.label.update:
          id: lbl_ac_main
          text: !lambda |-
            char buf[16];
            snprintf(buf, sizeof(buf), "%d°C", id(ac_temp));
            return std::string(buf);
          text_color: !lambda |-
            return id(ac_power) ? lv_color_hex(0xF4F7F8) : lv_color_hex(0x5A6467);
      - lvgl.label.update:
          id: lbl_ac_sub
          text: !lambda |-
            if (!id(ac_power))
              return std::string("OFF");
            static const char* fans[] = {"AUTO", "1", "2", "3", "4", "5"};
            int f = id(ac_fan);
            if (f < 0 || f > 5) f = 0;
            char buf[24];
            snprintf(buf, sizeof(buf), "COOL - FAN %s", fans[f]);
            return std::string(buf);
          text_color: !lambda |-
            return id(ac_power) ? lv_color_hex(0x63E7F2) : lv_color_hex(0x9EA7AA);
      - lvgl.label.update:
          id: lbl_ac_power
          text: !lambda |-
            return std::string(id(ac_power) ? "ON" : "OFF");
      - lvgl.widget.update:
          id: btn_ac_power
          border_color: !lambda |-
            return id(ac_power) ? lv_color_hex(0x63E7F2) : lv_color_hex(0x333B3E);
          bg_color: !lambda |-
            return id(ac_power) ? lv_color_hex(0x0E3238) : lv_color_hex(0x0B0F11);
      - lvgl.widget.update:
          id: btn_ac_focus_temp
          border_color: !lambda |-
            return id(ac_focus) == 0 ? lv_color_hex(0xFFD400) : lv_color_hex(0x333B3E);
          bg_color: !lambda |-
            return id(ac_focus) == 0 ? lv_color_hex(0x3A3200) : lv_color_hex(0x0B0F11);
      - lvgl.widget.update:
          id: btn_ac_focus_fan
          border_color: !lambda |-
            return id(ac_focus) == 1 ? lv_color_hex(0xFFD400) : lv_color_hex(0x333B3E);
          bg_color: !lambda |-
            return id(ac_focus) == 1 ? lv_color_hex(0x3A3200) : lv_color_hex(0x0B0F11);
      # Icons follow focus/power so the chips read at a glance
      - lvgl.label.update:
          id: icon_ac_temp
          text_color: !lambda |-
            return id(ac_focus) == 0 ? lv_color_hex(0xFFD400) : lv_color_hex(0x9EA7AA);
      - lvgl.label.update:
          id: icon_ac_fan
          text_color: !lambda |-
            return id(ac_focus) == 1 ? lv_color_hex(0xFFD400) : lv_color_hex(0x9EA7AA);
      - lvgl.label.update:
          id: icon_ac_power
          text_color: !lambda |-
            return id(ac_power) ? lv_color_hex(0x63E7F2) : lv_color_hex(0x5A6467);

lvgl:
  displays:
    - round_display
  touchscreens:
    - touch
  rotation: 180
  buffer_size: 25%
  on_idle:
    - timeout: 45s
      then:
        - if:
            condition:
              lambda: |-
                auto t = id(sntp_time).now();
                bool night = id(night_mode_enabled) && t.is_valid() && (t.hour >= 22 || t.hour < 8);
                return !(night || id(screen_forced_off) || id(display_asleep));
            then:
              - script.execute: go_home_clock
    - timeout: 60s
      then:
        - if:
            condition:
              lambda: |-
                auto t = id(sntp_time).now();
                bool night = id(night_mode_enabled) && t.is_valid() && (t.hour >= 22 || t.hour < 8);
                return night || id(screen_forced_off);
            then:
              - script.execute: screen_sleep
  # No `encoders:` indev on purpose. LVGL's group focus is a second selection
  # model on top of the *_index globals that actually paint the amber border,
  # and ESPHome puts every widget of every page into one flat group — so the
  # encoder walked focus onto widgets of *other* pages and the front button
  # clicked them. The encoder and the buttons are wired to scripts in
  # hardware.yaml instead (encoder_nav_cw/ccw, front_or_wake, nav_back), which
  # is where all navigation already lived.

  style_definitions:
    - id: st_bg
      bg_color: 0x0B0F11
      bg_opa: COVER
      border_width: 0
      pad_all: 0
      radius: 0
    - id: st_text
      text_color: 0xF4F7F8
      text_font: font_ui
      text_align: CENTER
    - id: st_accent
      arc_color: 0xFFD400
      arc_width: 8
      border_color: 0xFFD400
      border_width: 1
    - id: st_chip
      bg_color: 0x0B0F11
      bg_opa: COVER
      text_color: 0xF4F7F8
      text_font: font_label
      radius: 14
      pad_all: 2
      border_width: 1
      border_color: 0x333B3E
    - id: st_row
      bg_color: 0x0B0F11
      bg_opa: COVER
      text_color: 0xF4F7F8
      text_font: font_label
      radius: 14
      pad_all: 4
      border_width: 2
      border_color: 0x333B3E
    - id: st_seg
      bg_color: 0x0B0F11
      bg_opa: COVER
      border_width: 2
      border_color: 0x333B3E
      radius: 18
      text_color: 0xF4F7F8
      text_font: font_label
      pad_all: 2

  pages:
    # —— Home clock (minute dial only here) ——
    - id: page_clock
      styles: st_bg
      widgets:
        - meter:
            id: clock_meter
            align: CENTER
            width: 236
            height: 236
            bg_opa: TRANSP
            border_width: 0
            indicator:
              bg_opa: TRANSP
            scales:
              - id: clock_scale
                range_from: 0
                range_to: 60
                angle_range: 360
                rotation: 90
                ticks:
                  count: 61
                  length: 3
                  width: 1
                  color: 0x9EA7AA
                  major:
                    stride: 5
                    length: 7
                    width: 2
                    color: 0xF4F7F8
                    label_gap: 10
                indicators:
                  - line:
                      id: ind_clock_min
                      width: 3
                      color: 0xFFD400
                      length: 12
                      radial_offset: 98
                      value: 0
        - label:
            id: lbl_clock_dow
            styles: st_text
            align: CENTER
            x: -48
            y: -52
            text_font: font_label
            text_color: 0x63E7F2
            text: "---"
        - label:
            id: lbl_clock_dom
            styles: st_text
            align: CENTER
            y: -52
            text_font: font_big
            text: "--"
        - label:
            id: lbl_clock_mon
            styles: st_text
            align: CENTER
            x: 48
            y: -52
            text_font: font_label
            text_color: 0x63E7F2
            text: "---"
        - label:
            id: lbl_clock_main
            styles: st_text
            align: CENTER
            y: 12
            text_font: font_clock
            text: "--:--"
        - label:
            id: lbl_clock_ampm
            styles: st_text
            align: CENTER
            y: 52
            text_font: font_label
            text_color: 0x9EA7AA
            text: ""
        - button:
            id: btn_clock_wake
            align: CENTER
            width: 240
            height: 240
            bg_opa: TRANSP
            shadow_opa: TRANSP
            border_width: 0
            # Double tap opens the launcher, detected in clock_tap from click
            # timing alone. LVGL's own DOUBLE_CLICKED is logged for reference
            # but not used: it also requires both taps within scroll_limit
            # (10px), which a finger rarely satisfies.
            on_press:
              - script.execute: clock_tap

    # —— Pie launcher (6 wedges + Home) ——
    - id: page_launcher
      styles: st_bg
      on_load:
        then:
          - lambda: "id(display_asleep) = false;"
          - script.execute: apply_launcher_focus
      widgets:
        - button:
            id: btn_home_center
            styles: st_seg
            width: 44
            height: 44
            align: CENTER
            border_color: 0x333B3E
            widgets:
              - label:
                  text: "HOME"
                  align: CENTER
                  text_font: font_label
                  text_color: 0xF4F7F8
            on_click:
              - script.execute: go_home_clock
        # Settings top
        - button:
            id: btn_seg_settings
            styles: st_seg
            width: 72
            height: 44
            align: CENTER
            x: 0
            y: -78
            widgets:
              - label:
                  id: icon_seg_settings
                  text: "\U000F0493"
                  align: CENTER
                  y: -8
                  text_font: font_icon
                  text_color: 0x9EA7AA
              - label:
                  id: lbl_seg_settings
                  text: "SET"
                  align: CENTER
                  y: 11
                  text_font: font_label
            on_press:
              - lambda: "id(launcher_index) = 0;"
              - script.execute: apply_launcher_focus
            on_click:
              - lambda: "id(launcher_index) = 0;"
              - script.execute: open_settings
        # AC NE
        - button:
            id: btn_seg_ac
            styles: st_seg
            width: 64
            height: 42
            align: CENTER
            x: 64
            y: -38
            border_color: 0xFFD400
            widgets:
              - label:
                  id: icon_seg_ac
                  text: "\U000F0717"
                  align: CENTER
                  y: -8
                  text_font: font_icon
                  text_color: 0x63E7F2
              - label:
                  id: lbl_seg_ac
                  text: "AC"
                  align: CENTER
                  y: 11
                  text_font: font_label
                  text_color: 0x9EA7AA
            on_press:
              - lambda: "id(launcher_index) = 1;"
              - script.execute: apply_launcher_focus
            on_click:
              - lambda: "id(launcher_index) = 1;"
              - script.execute: open_ac
        # Plugs SE
        - button:
            id: btn_seg_plugs
            styles: st_seg
            width: 64
            height: 42
            align: CENTER
            x: 64
            y: 38
            widgets:
              - label:
                  id: icon_seg_plugs
                  text: "\U000F06A5"
