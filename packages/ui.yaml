  on_boot:
    - delay: 500ms
    # Settings persist via include/settings_store.h (immediate NVS write), so
    # they are read back explicitly rather than through restore_value.
    - lambda: |-
        id(display_rotation) = m5dial::load_or<m5dial::KEY_ROTATION>(180);
        id(night_mode_enabled) = m5dial::load_or<m5dial::KEY_NIGHT>(false);
        id(fallback_ap_enabled) = m5dial::load_or<m5dial::KEY_AP>(${ap_default});
        id(ui_sound_enabled) = m5dial::load_or<m5dial::KEY_SOUND>(false);
        id(ac_power) = m5dial::load_or<m5dial::KEY_AC_POWER>(false);
        id(ac_temp) = m5dial::load_or<m5dial::KEY_AC_TEMP>(24);
        id(ac_fan) = m5dial::load_or<m5dial::KEY_AC_FAN>(0);
        id(clock_24h) = m5dial::load_or<m5dial::KEY_CLOCK24>(true);
        id(ring_numerals) = m5dial::load_or<m5dial::KEY_TICKNUM>(true);
    - script.execute: apply_fallback_ap
    - script.execute: apply_display_rotation
    - script.execute: apply_ring_numerals
    - light.turn_on:
        id: display_backlight
        brightness: 40%
    - lvgl.page.show: page_clock
