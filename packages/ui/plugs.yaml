                  align: LEFT_MID
                  x: 8
                  text_font: font_icon
                  text_color: 0x63E7F2
              - label:
                  id: lbl_plug_1_name
                  text: ${plug_2_name}
                  align: LEFT_MID
                  x: 30
                  text_font: font_label
              - label:
                  id: lbl_plug_1_st
                  text: "OFF"
                  align: CENTER
                  text_font: font_label
              - label:
                  id: lbl_plug_1_w
                  text: "--W"
                  align: RIGHT_MID
                  x: -10
                  text_font: font_label
                  text_color: 0x9EA7AA
