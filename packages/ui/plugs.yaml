              - script.execute: plug_toggle
        - button:
            id: row_plug_2
            styles: st_row
            width: 178
            height: 30
            align: CENTER
            y: 13
            widgets:
              - label:
                  text: "\U000F06A5"
                  align: LEFT_MID
                  x: 8
                  text_font: font_icon
                  text_color: 0x63E7F2
              - label:
                  id: lbl_plug_2_name
                  text: ${plug_3_name}
                  align: LEFT_MID
                  x: 30
                  text_font: font_label
              - label:
                  id: lbl_plug_2_st
                  text: "OFF"
                  align: CENTER
                  text_font: font_label
              - label:
                  id: lbl_plug_2_w
                  text: "--W"
                  align: RIGHT_MID
                  x: -10
                  text_font: font_label
                  text_color: 0x9EA7AA
            on_click:
              - lambda: |-
                  int base = (id(plug_sel) / 4) * 4 + 2;
                  if (base < ${plug_count}) id(plug_sel) = base;
              - script.execute: plug_toggle
        - button:
            id: row_plug_3
            styles: st_row
            width: 178
            height: 30
            align: CENTER
            y: 45
            widgets:
              - label:
