# Time hub ring and its pages. Their logic lives in packages/time.yaml.

script:
  - id: open_time
    then:
      - light.turn_on:
          id: display_backlight
          brightness: 100%
      - lvgl.page.show: page_time
      - script.execute: time_hub_refresh
      - script.execute: time_hub_focus

lvgl:
  pages:
    # —— Time hub: launcher-style ring, one function per page ——
    - id: page_time
      styles: st_bg
      widgets:
        - label:
            styles: st_text
            align: CENTER
            y: -94
            text_font: font_label
            text_color: 0x9EA7AA
            text: "TIME"
        - label:
            id: lbl_hub_clock
            styles: st_text
            align: CENTER
            y: -2
            text_font: font_big
            text: "--:--"
        - button:
            id: btn_hub_cities
            styles: st_seg
            width: 52
            height: 44
            align: CENTER
            x: 0
            y: -58
            widgets:
              - label:
                  id: icon_hub_cities
                  text: "\U000F01E7"
                  align: CENTER
                  text_font: font_icon
                  text_color: 0x63E7F2
            on_press:
              - lambda: "id(time_hub_index) = 0;"
              - script.execute: time_hub_focus
            on_click:
              - lambda: "id(time_hub_index) = 0;"
              - script.execute: time_hub_open
        - button:
            id: btn_hub_pomo
            styles: st_seg
            width: 52
            height: 44
            align: CENTER
            x: 66
            y: -18
            widgets:
              - label:
                  id: icon_hub_pomo
                  text: "\U000F051F"
                  align: CENTER
                  text_font: font_icon
                  text_color: 0xFF8A00
            on_press:
              - lambda: "id(time_hub_index) = 1;"
              - script.execute: time_hub_focus
            on_click:
              - lambda: "id(time_hub_index) = 1;"
              - script.execute: time_hub_open
        - button:
            id: btn_hub_sw
            styles: st_seg
            width: 52
            height: 44
            align: CENTER
            x: 42
            y: 52
            widgets:
              - label:
                  id: icon_hub_sw
                  text: "\U000F051B"
                  align: CENTER
                  text_font: font_icon
                  text_color: 0x9EA7AA
            on_press:
              - lambda: "id(time_hub_index) = 2;"
              - script.execute: time_hub_focus
            on_click:
              - lambda: "id(time_hub_index) = 2;"
              - script.execute: time_hub_open
        - button:
            id: btn_hub_timer
            styles: st_seg
            width: 52
            height: 44
            align: CENTER
            x: -42
            y: 52
            widgets:
              - label:
                  id: icon_hub_timer
                  text: "\U000F13AB"
                  align: CENTER
                  text_font: font_icon
                  text_color: 0x9EA7AA
            on_press:
              - lambda: "id(time_hub_index) = 3;"
              - script.execute: time_hub_focus
            on_click:
              - lambda: "id(time_hub_index) = 3;"
              - script.execute: time_hub_open
        - button:
            id: btn_hub_wx
            styles: st_seg
            width: 52
            height: 44
            align: CENTER
            x: -66
            y: -18
            widgets:
              - label:
                  id: icon_hub_wx
