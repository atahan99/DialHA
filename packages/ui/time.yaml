              - script.execute: time_hub_focus
            on_click:
              - lambda: "id(time_hub_index) = 4;"
              - script.execute: time_hub_open
        - button:
            id: btn_back_time
            styles: st_chip
            width: 42
            height: 24
            align: CENTER
            y: 96
            widgets:
              - label:
                  text: "\U000F004D"
                  align: CENTER
                  text_font: font_icon
