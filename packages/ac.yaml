# Arçelik 09325 A — synthesised IR. Protocol reverse-engineered from 50 captured
# frames; see docs/ac-ir-protocol.md. Cool-only; mode is fixed COOL.
# Unit IR U002 on PORT.B: yellow=G2=TX, white=G1=RX.
#
# Frame: 28 bits MSB-first = 7 nibbles  "8 8 n2 n3 T n5 K"
#   n2  0 normally; C only inside the OFF literal
#   n3  0 = power-on, 8 = adjust while already running
#   T   temperature, °C - 15        (18..30  ->  3..F)
#   n5  fan   1bar=0  2=9  3=2  4=A  5=4  auto=5
#   K   checksum = (sum of the first six nibbles) & 0xF
# OFF is the fixed literal 0x88C0051 — it does NOT carry temp/fan.
#
# Timing: hdr +3000/-9650us, bit mark +500, one -1530, zero -500, stop +500.
# One frame per press, no repeat frame (59 pulses total).
#
# Nothing is learned or stored at runtime: every command is computed, so the
# Dial works immediately after a reboot or OTA. The receiver decodes the same
# format, so pressing the physical remote keeps the Dial's display in sync.

substitutions:
  # Frames sent per command. 1 = what the handheld remote does. Raise if the
  # AC misses commands at your mounting angle; each extra costs ~90ms.
  ac_tx_repeats: "5"
  # Carrier frequency. NOTE: this was never measured -- an IR demodulator
  # strips the carrier, so the receiver cannot recover it, and the Pronto dump
  # we captured shows 38kHz only because ESPHome hardcodes that in its dumper.
  # If range is poor, try 36000 and 40000: a 2kHz mismatch against the AC's
  # bandpass filter costs a large fraction of the range.
  ac_carrier_hz: "38000"
  # Duty of the carrier square wave = average LED power. 50% is standard;
  # 33-50% is what TSOP-style receivers are designed for, so going much higher
  # can reduce sensitivity rather than help. Worth a try, not a sure win.
  ac_carrier_duty: "50"

remote_transmitter:
  id: ir_tx
  pin: GPIO2
  carrier_duty_percent: ${ac_carrier_duty}%
  non_blocking: false
  on_complete:
    then:
      # Ignore our own emission on the co-located receiver. Loopback mode
      # skips the guard so the Dial decodes what it just sent, which verifies
      # the transmitted frame bit-for-bit against what the remote produces.
      - lambda: |-
          if (!id(ir_loopback))
            id(ac_rx_guard) = millis() + 300;

remote_receiver:
  id: ir_rx
  pin:
    number: GPIO1
    inverted: true
    mode:
      input: true
      pullup: true
  tolerance: 25%
  idle: 32ms
  on_raw:
    then:
      - lambda: |-
          // Follow the physical remote: decode, verify, adopt.
          if ((int32_t) (millis() - id(ac_rx_guard)) < 0)
            return;
          // Log every external capture before the filters, otherwise a rejected
          // frame is indistinguishable from nothing arriving at all.
          ESP_LOGD("ac", "rx len=%u hdr=%d/%d", (unsigned) x.size(),
                   x.size() > 0 ? (int) x[0] : 0, x.size() > 1 ? (int) x[1] : 0);
          if (id(ir_capture_arm) && x.size() >= 56) {
            // Drop the trailing idle space; keep the frame itself verbatim.
            size_t n = x.size();
            if (n > 0 && x[n - 1] < 0) n--;
            id(ir_capture).assign(x.begin(), x.begin() + n);
            id(ir_capture_arm) = false;
            ESP_LOGI("ac", "CAPTURED %u pulses verbatim", (unsigned) n);
          }
          if (x.size() < 56 || x.size() > 64) {
            ESP_LOGW("ac", "rx reject: length %u", (unsigned) x.size());
            return;
          }
          if (x[0] < 2400 || x[0] > 3600) {
            ESP_LOGW("ac", "rx reject: header mark %d", (int) x[0]);
            return;
          }
          if (x[1] > -8500 || x[1] < -11000) {
            ESP_LOGW("ac", "rx reject: header space %d", (int) x[1]);
            return;
          }
          // Stop at 28 bits. The captured vector is 60 entries -- 2 header,
          // 56 bit halves, the stop mark and a trailing idle space -- so an
          // unbounded loop pairs the stop mark with the idle and invents a
          // 29th bit. (ESPHome's raw dumper prints size-1, which is why the
          // protocol was originally measured as 59 pulses rather than 60.)
          uint32_t v = 0;
          int bits = 0;
          for (size_t i = 2; i + 1 < x.size() && bits < 28; i += 2) {
            if (x[i] <= 0 || x[i + 1] >= 0)
              break;
            v = (v << 1) | ((-x[i + 1] > 1000) ? 1u : 0u);
            bits++;
          }
          if (bits != 28) {
            ESP_LOGW("ac", "rx reject: %d bits", bits);
            return;
          }
          int nib[7];
          for (int i = 0; i < 7; i++)
            nib[i] = (v >> (4 * (6 - i))) & 0xF;
          if (nib[0] != 8 || nib[1] != 8) {
            ESP_LOGW("ac", "rx reject: preamble %X%X", nib[0], nib[1]);
            return;
          }
          int sum = 0;
          for (int i = 0; i < 6; i++)
            sum += nib[i];
          if ((sum & 0xF) != nib[6]) {
            ESP_LOGW("ac", "checksum fail 0x%07X", (unsigned) v);
            return;
          }
          if (v == 0x88C0051) {
            id(ac_power) = false;
            ESP_LOGI("ac", "remote: OFF");
            return;
          }
          id(ac_power) = true;
          int t = nib[4] + 15;
          if (t >= 18 && t <= 30)
            id(ac_temp) = t;
          static const int FAN[6] = {5, 0, 9, 2, 0xA, 4};
          for (int i = 0; i < 6; i++) {
            if (FAN[i] == nib[5]) {
              id(ac_fan) = i;
              break;
            }
          }
          ESP_LOGI("ac", "remote: ON %dC fan=%d", id(ac_temp), id(ac_fan));
      - script.execute: ac_persist
      - script.execute: ac_refresh

globals:
  # Persisted through include/settings_store.h rather than restore_value, so a
  # change survives an immediate power cut (see the note in README "Settings
  # persistence"). Loaded in the lvgl on_boot block in ui.yaml.
  - id: ac_power
    type: bool
    initial_value: "false"
  - id: ac_temp
    type: int
    initial_value: "24"
  # 0 = AUTO, 1..5 = fan bars
  - id: ac_fan
    type: int
    initial_value: "0"
  - id: ac_rx_guard
    type: uint32_t
    initial_value: "0"
  - id: ir_beacon_count
    type: int
    initial_value: "0"
  - id: ir_loopback
    type: bool
    initial_value: "false"
  # Runtime repeat count so power frames can be sent once while state frames
  # are repeated for range.
  - id: ac_repeats
    type: int
    initial_value: "${ac_tx_repeats}"
  # Verbatim capture/replay: proves whether our synthesised timing differs from
  # the remote's in a way the AC cares about.
  - id: ir_capture
    type: std::vector<int32_t>
  - id: ir_capture_arm
    type: bool
    initial_value: "false"

script:
  - id: ac_persist
    then:
      - lambda: |-
          m5dial::stage<m5dial::KEY_AC_POWER>(id(ac_power));
          m5dial::stage<m5dial::KEY_AC_TEMP>(id(ac_temp));
          m5dial::stage<m5dial::KEY_AC_FAN>(id(ac_fan));
          m5dial::commit();

  # Expand a 28-bit code into Arçelik raw timings and send it.
  - id: ac_tx_code
    parameters:
      code: int
    then:
      - remote_transmitter.transmit_raw:
          transmitter_id: ir_tx
          carrier_frequency: ${ac_carrier_hz}Hz
          # The remote sends one frame per press, but the Unit IR's emitter is
          # much weaker than a handheld remote, so a marginal aim drops frames.
          # Every frame is absolute state, so resending is idempotent — the AC
          # itself re-sends an identical frame when you press TEMP+ at 30 C.
          # Costs ~230ms of blocking transmit per command instead of ~52ms.
          repeat:
            times: !lambda "return id(ac_repeats);"
            wait_time: 40ms
          code: !lambda |-
            uint32_t v = (uint32_t) code;
            std::vector<int32_t> out;
            out.reserve(59);
            out.push_back(3000);
            out.push_back(-9650);
            for (int i = 27; i >= 0; i--) {
              out.push_back(500);
              out.push_back(((v >> i) & 1) ? -1530 : -500);
            }
            out.push_back(500);
            return out;
      - logger.log:
          level: INFO
          format: "AC sent 0x%07X"
          args: ["(unsigned) code"]

  # Build the state frame for the current temp/fan. n3: 0 = power-on, 8 = adjust.
  - id: ac_tx_state
    parameters:
      n3: int
    then:
      - script.execute:
          id: ac_tx_code
          code: !lambda |-
            static const int FAN[6] = {5, 0, 9, 2, 0xA, 4};
            int t = id(ac_temp);
            if (t < 18) t = 18;
            if (t > 30) t = 30;
            int f = id(ac_fan);
            if (f < 0 || f > 5) f = 0;
            int nib[7] = {8, 8, 0, n3, t - 15, FAN[f], 0};
            int sum = 0;
            for (int i = 0; i < 6; i++)
              sum += nib[i];
            nib[6] = sum & 0xF;
            uint32_t v = 0;
            for (int i = 0; i < 7; i++)
              v = (v << 4) | nib[i];
            return (int) v;

  - id: ac_power_on
    then:
      - lambda: "id(ac_power) = true;"
      - script.execute:
          id: ac_tx_state
          n3: 0
      - script.execute: ac_persist
      - script.execute: ac_refresh

  - id: ac_power_off
    then:
      - lambda: "id(ac_power) = false;"
      - script.execute:
          id: ac_tx_code
          code: 0x88C0051
      - script.execute: ac_persist
      - script.execute: ac_refresh

  - id: ac_power_toggle
    then:
      - if:
          condition:
            lambda: "return id(ac_power);"
          then:
            - script.execute: ac_power_off
          else:
            - script.execute: ac_power_on

  # Debounced: the encoder can spin freely, one frame goes out when it settles.
  - id: ac_commit
    mode: restart
    then:
      - delay: 400ms
      - if:
          condition:
            lambda: "return id(ac_power);"
          then:
            - script.execute:
                id: ac_tx_state
                n3: 8
            - script.execute: ac_persist
          else:
            # Adjusting while off implies "turn on with these settings"
            - script.execute: ac_power_on

# Remote control for bench testing: lets a host script drive the AC over the
# ESPHome API so frames can be sent and compared without touching the Dial.
api:
  actions:
    - action: ac_send_code
      variables:
        code: int
      then:
        - logger.log:
            level: INFO
            format: "API ac_send_code 0x%07X"
            args: ["(unsigned) code"]
        - script.execute:
            id: ac_tx_code
            code: !lambda "return code;"
    - action: ac_loopback
      variables:
        enable: bool
      then:
        - lambda: |-
            id(ir_loopback) = enable;
            ESP_LOGI("ac", "IR loopback %s", enable ? "ON" : "OFF");
    - action: ac_arm_capture
      then:
        - lambda: |-
            id(ir_capture_arm) = true;
            ESP_LOGI("ac", "armed - press the remote at the dome");
    - action: ac_replay
      then:
        - if:
            condition:
              lambda: "return id(ir_capture).size() >= 56;"
            then:
              - logger.log:
                  level: INFO
                  format: "replaying captured frame verbatim"
              - remote_transmitter.transmit_raw:
                  transmitter_id: ir_tx
                  carrier_frequency: ${ac_carrier_hz}Hz
                  code: !lambda "return id(ir_capture);"
            else:
              - logger.log:
                  level: WARN
                  format: "nothing captured yet"
    - action: ac_set_repeats
      variables:
        n: int
      then:
        - lambda: |-
            id(ac_repeats) = n < 1 ? 1 : (n > 10 ? 10 : n);  // each repeat blocks ~90 ms
            ESP_LOGI("ac", "tx repeats = %d", id(ac_repeats));
    - action: ac_set_state
      variables:
        temp: int
        fan: int
        n3: int
      then:
        - lambda: |-
            if (temp >= 18 && temp <= 30) id(ac_temp) = temp;
            if (fan >= 0 && fan <= 5) id(ac_fan) = fan;
            ESP_LOGI("ac", "API ac_set_state temp=%d fan=%d n3=%d",
                     id(ac_temp), id(ac_fan), n3);
        - script.execute:
            id: ac_tx_state
            n3: !lambda "return n3;"
        - script.execute: ac_refresh

# —— IR range diagnostics ——————————————————————————————————————
# Beacon mode: re-sends the current state every 2s so you can carry the Dial
# (or reposition the Unit IR) and hear exactly where the AC starts responding.
# Safe to leave on: the frame is absolute state, so repeats change nothing.
# Toggle from Home Assistant, then watch `esphome logs` for the send count.
switch:
  - platform: template
    id: ir_beacon
    name: "IR Beacon (range test)"
    optimistic: true
    icon: "mdi:signal-distance-variant"
    turn_on_action:
      - lambda: "id(ir_beacon_count) = 0;"
      - logger.log:
          level: INFO
          format: "IR beacon ON - walk the emitter around, AC beeps when it hears"
    turn_off_action:
      - logger.log:
          level: INFO
          format: "IR beacon OFF"

interval:
  - interval: 2s
    then:
      - if:
          condition:
            switch.is_on: ir_beacon
          then:
            - lambda: |-
                id(ir_beacon_count)++;
                ESP_LOGI("ac", "beacon ping #%d  %dC fan=%d", id(ir_beacon_count),
                         id(ac_temp), id(ac_fan));
            - script.execute:
                id: ac_tx_state
                n3: 8
