# Arçelik 09325 A — synthesised IR. Protocol reverse-engineered from 50 captured
# frames; see docs/ac-ir-protocol.md. Cool-only; mode is fixed COOL.
# Unit IR U002 on PORT.B: yellow=G2=TX, white=G1=RX.
#
# Frame: 28 bits MSB-first = 7 nibbles  "8 8 n2 n3 T n5 K"
#   n2  0 normally; C only inside the OFF literal
#   n3  0 = power-on, 8 = adjust while already running
#   T   temperature, °C - 15        (18..30  ->  3..F)
#   n5  fan   1bar=0  2=9  3=2  4=A  5=4  auto=5
#   K   checksum = (sum of the first six nibbles) & 0xF
# OFF is the fixed literal 0x88C0051 — it does NOT carry temp/fan.
#
# Timing: hdr +3000/-9650us, bit mark +500, one -1530, zero -500, stop +500.
# One frame per press, no repeat frame (59 pulses total).
#
# Nothing is learned or stored at runtime: every command is computed, so the
# Dial works immediately after a reboot or OTA. The receiver decodes the same
# format, so pressing the physical remote keeps the Dial's display in sync.

substitutions:
  # Frames sent per command. 1 = what the handheld remote does. Raise if the
  # AC misses commands at your mounting angle; each extra costs ~90ms.
  ac_tx_repeats: "3"

remote_transmitter:
  id: ir_tx
  pin: GPIO2
  carrier_duty_percent: 50%
  non_blocking: false
  on_complete:
    then:
      # Ignore our own emission on the co-located receiver
      - lambda: "id(ac_rx_guard) = millis() + 300;"

remote_receiver:
  id: ir_rx
  pin:
    number: GPIO1
    inverted: true
    mode:
      input: true
      pullup: true
  tolerance: 25%
  idle: 32ms
  on_raw:
    then:
      - lambda: |-
          // Follow the physical remote: decode, verify, adopt.
          if ((int32_t) (millis() - id(ac_rx_guard)) < 0)
            return;
          if (x.size() < 56 || x.size() > 64)
            return;
          if (x[0] < 2400 || x[0] > 3600)
            return;
          if (x[1] > -8500 || x[1] < -11000)
            return;
          uint32_t v = 0;
          int bits = 0;
          for (size_t i = 2; i + 1 < x.size(); i += 2) {
            if (x[i] <= 0 || x[i + 1] >= 0)
              break;
            v = (v << 1) | ((-x[i + 1] > 1000) ? 1u : 0u);
            bits++;
          }
          if (bits != 28)
            return;
          int nib[7];
          for (int i = 0; i < 7; i++)
            nib[i] = (v >> (4 * (6 - i))) & 0xF;
          if (nib[0] != 8 || nib[1] != 8)
            return;
          int sum = 0;
          for (int i = 0; i < 6; i++)
            sum += nib[i];
          if ((sum & 0xF) != nib[6]) {
            ESP_LOGW("ac", "checksum fail 0x%07X", (unsigned) v);
            return;
          }
          if (v == 0x88C0051) {
            id(ac_power) = false;
            ESP_LOGI("ac", "remote: OFF");
            return;
          }
          id(ac_power) = true;
          int t = nib[4] + 15;
          if (t >= 18 && t <= 30)
            id(ac_temp) = t;
          static const int FAN[6] = {5, 0, 9, 2, 0xA, 4};
          for (int i = 0; i < 6; i++) {
            if (FAN[i] == nib[5]) {
              id(ac_fan) = i;
              break;
            }
          }
          ESP_LOGI("ac", "remote: ON %dC fan=%d", id(ac_temp), id(ac_fan));
      - script.execute: ac_refresh

globals:
  - id: ac_power
    type: bool
    restore_value: true
    initial_value: "false"
  - id: ac_temp
    type: int
    restore_value: true
    initial_value: "24"
  # 0 = AUTO, 1..5 = fan bars
  - id: ac_fan
    type: int
    restore_value: true
    initial_value: "0"
  - id: ac_rx_guard
    type: uint32_t
    initial_value: "0"

script:
  # Expand a 28-bit code into Arçelik raw timings and send it.
  - id: ac_tx_code
    parameters:
      code: int
    then:
      - remote_transmitter.transmit_raw:
          transmitter_id: ir_tx
          carrier_frequency: 38kHz
          # The remote sends one frame per press, but the Unit IR's emitter is
          # much weaker than a handheld remote, so a marginal aim drops frames.
          # Every frame is absolute state, so resending is idempotent — the AC
          # itself re-sends an identical frame when you press TEMP+ at 30 C.
          # Costs ~230ms of blocking transmit per command instead of ~52ms.
          repeat:
            times: ${ac_tx_repeats}
            wait_time: 40ms
          code: !lambda |-
            uint32_t v = (uint32_t) code;
            std::vector<int32_t> out;
            out.reserve(59);
            out.push_back(3000);
            out.push_back(-9650);
            for (int i = 27; i >= 0; i--) {
              out.push_back(500);
              out.push_back(((v >> i) & 1) ? -1530 : -500);
            }
            out.push_back(500);
            return out;
      - logger.log:
          level: INFO
          format: "AC sent 0x%07X"
          args: ["(unsigned) code"]

  # Build the state frame for the current temp/fan. n3: 0 = power-on, 8 = adjust.
  - id: ac_tx_state
    parameters:
      n3: int
    then:
      - script.execute:
          id: ac_tx_code
          code: !lambda |-
            static const int FAN[6] = {5, 0, 9, 2, 0xA, 4};
            int t = id(ac_temp);
            if (t < 18) t = 18;
            if (t > 30) t = 30;
            int f = id(ac_fan);
            if (f < 0 || f > 5) f = 0;
            int nib[7] = {8, 8, 0, n3, t - 15, FAN[f], 0};
            int sum = 0;
            for (int i = 0; i < 6; i++)
              sum += nib[i];
            nib[6] = sum & 0xF;
            uint32_t v = 0;
            for (int i = 0; i < 7; i++)
              v = (v << 4) | nib[i];
            return (int) v;

  - id: ac_power_on
    then:
      - lambda: "id(ac_power) = true;"
      - script.execute:
          id: ac_tx_state
          n3: 0
      - script.execute: ac_refresh

  - id: ac_power_off
    then:
      - lambda: "id(ac_power) = false;"
      - script.execute:
          id: ac_tx_code
          code: 0x88C0051
      - script.execute: ac_refresh

  - id: ac_power_toggle
    then:
      - if:
          condition:
            lambda: "return id(ac_power);"
          then:
            - script.execute: ac_power_off
          else:
            - script.execute: ac_power_on

  # Debounced: the encoder can spin freely, one frame goes out when it settles.
  - id: ac_commit
    mode: restart
    then:
      - delay: 400ms
      - if:
          condition:
            lambda: "return id(ac_power);"
          then:
            - script.execute:
                id: ac_tx_state
                n3: 8
          else:
            # Adjusting while off implies "turn on with these settings"
            - script.execute: ac_power_on
