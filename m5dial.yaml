substitutions:
  name: m5-dial
  friendly_name: M5 Dial

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.11.0
  includes:
    - include/wx_icons.h
    - include/tz_dst.h
    - include/settings_store.h
    - include/timefmt.h
    - include/agent.h
  platformio_options:
    board_build.flash_mode: dio
  on_boot:
    priority: 600
    then:
      - pcf8563.read_time:

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

# restore_value globals are batched and flushed on this timer. The 60s default
# means a setting changed just before unplugging is silently lost; settings that
# matter also call global_preferences->sync() explicitly (see ui.yaml).
preferences:
  flash_write_interval: 10s

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  id: wifi_sta
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Dial stays plugged in — NONE avoids stuck "scanning" on S3
  power_save_mode: NONE
  # Off by default — Settings → AP arms the 90s fallback hotspot
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password
    ap_timeout: 0s
  on_connect:
    - logger.log: "WiFi connected"
  on_disconnect:
    - logger.log: "WiFi disconnected"

captive_portal:

packages:
  hardware: !include packages/hardware.yaml
  entities: !include packages/entities.yaml
  ac: !include packages/ac.yaml
  time: !include packages/time.yaml
  weather: !include packages/weather.yaml
  ui: !include packages/ui.yaml
