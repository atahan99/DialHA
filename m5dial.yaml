# Personal build: credentials from secrets.yaml, plus the debug package that
# scripts/dial.py and scripts/ac_test.py talk to. The .bin this produces
# contains those secrets; see firmware/README.md.
substitutions:
  name: m5-dial
  friendly_name: M5 Dial
  # Fallback hotspot stays off until Settings → AP turns it on
  ap_default: "false"

packages:
  core: !include packages/core.yaml
  debug: !include packages/debug.yaml

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password
    ap_timeout: 0s
