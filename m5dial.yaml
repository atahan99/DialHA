# Personal build: credentials from secrets.yaml, plus the debug package that
# scripts/dial.py and scripts/ac_test.py talk to. The .bin this produces
# contains those secrets; see firmware/README.md.
substitutions:
  name: m5-dial
  friendly_name: M5 Dial

packages:
  core: !include packages/core.yaml
  debug: !include packages/debug.yaml

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password
    # Off until Settings → AP arms it (90 s without Wi-Fi). Password-protected
    # because the captive portal behind it also accepts firmware uploads.
    ap_timeout: 0s

captive_portal:
